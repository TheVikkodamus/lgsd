<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGSD APP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="">

<body>
    <!-- Navigation bar -->
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#donate">Donate</a>
        <a href="#contact">Contact</a>
        <a href="#project">Projects</a>
    </div>

    <!-- Header -->
    <h1>LGSD TODO list</h1>
    <p>Welcome to LGSD (Let's Get Sh1t Done!), the ultimate web app for organizing your tasks. Easily add your daily to-do items and accomplish them with ease!</p>
    <br />

    <!-- Task input section -->
    <h2>TODO List</h2>
    <input type="text" id="new-task" placeholder="Enter a task..." aria-label="New task input">
    <br />
    <p>If a  task needs a reminder then use this tool. If not just submit the task without it!</p>
    <input type="datetime-local" id="reminder-time" placeholder="Set a reminder">
    <br />
    <button id="add-task" aria-label="Add new task">Add</button>
    <ul id="task-list">
        <!-- Example task -->
        <!-- <li>Example Task</li> -->
    </ul>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
